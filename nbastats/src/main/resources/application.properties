spring.config.import=optional:file:.env[.properties]

# Hosting platforms assign the port at runtime; fall back to 8080 locally.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nba}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.write-enabled=${APP_WRITE_ENABLED:false}

# Credentials for the write endpoints. No default password on purpose: an unset
# value leaves writes unauthenticatable rather than open.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
