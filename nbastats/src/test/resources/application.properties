spring.datasource.url=jdbc:h2:mem:nbastats;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
# H2 has no unaccent(). schema.sql registers a Java stand-in so the
# accent-insensitive name queries run here the same way they do on Postgres.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.write-enabled=true
app.cors.allowed-origins=http://localhost:3000
logging.level.root=WARN
logging.level.org.hibernate.SQL=OFF
debug=false
