name: Keep the API warm

# Render's free tier spins a service down after 15 minutes idle, and the cold
# start costs ~115 seconds -- measured, not estimated. Anyone opening the site
# cold waits nearly two minutes on a blank table, which is the worst possible
# first impression for a link sent to a recruiter.
#
# The schedule below is sized to fit inside three separate free tiers at once:
#
#   Actions minutes   60 runs/day x 22 weekdays ~= 1320 min/month, under the
#                     2000/month that private repos get. (Public repos get
#                     unlimited, so this can be widened after going public.)
#   Render instances  ~220 instance-hours/month, well under the 750 allowance.
#                     Pinging 24/7 would cost ~744 and leave no headroom at all.
#   Supabase          one 1-row query per ping; negligible.
#
# The trade is deliberate: weekday daytime is kept warm, nights and weekends are
# not. Widen the cron below if that is the wrong trade.
#
# Note that GitHub's scheduled runs are best-effort and can drift by 5-15
# minutes under load, so an occasional cold start will still slip through. A
# dedicated uptime monitor (cron-job.org, UptimeRobot -- both free) fires far
# more punctually and costs no Actions minutes; this workflow is the
# no-extra-signup option, not the most precise one.

on:
  schedule:
    # Every 10 minutes, 13:00-22:59 UTC (09:00-18:59 ET), Monday to Friday.
    - cron: '*/10 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the API
        run: |
          set -uo pipefail
          URL='https://nba-stats-api-4jl6.onrender.com/api/v1/players/page?page=0&size=1'

          # A cold start legitimately takes ~2 minutes, so the timeout has to be
          # generous or this job would report the service down every time it
          # succeeds at waking it.
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body.json -w '%{http_code}' --max-time 180 "$URL" || echo "000")
            elapsed_note=""
            if [[ "$code" == "200" ]]; then
              total=$(python3 -c "import json;print(json.load(open('/tmp/body.json'))['totalElements'])" 2>/dev/null || echo '?')
              echo "attempt $attempt: HTTP 200, ${total} players. API is warm."
              exit 0
            fi
            echo "attempt $attempt: HTTP $code${elapsed_note}"
            [[ $attempt -lt 3 ]] && sleep 20
          done

          echo "::error::API did not return 200 after 3 attempts. Last status: $code"
          head -c 500 /tmp/body.json || true
          exit 1
