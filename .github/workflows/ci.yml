name: CI

# Runs the checks that were previously only ever run by hand. The repo is one
# unit deployed as two services, so both halves are built on every change: a
# green tick here is what says "main is safe to auto-deploy", since merging to
# main ships straight to Render and Vercel with no other gate in between.
#
# The two jobs are independent and run in parallel. Neither touches the
# database or the live services -- backend tests use H2, and the frontend build
# is a static compile that never calls the API.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant. Cancel it
# rather than paying for both, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nbastats
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          # Caches ~/.m2 keyed on the pom, so a run that changes no dependency
          # skips re-downloading the whole Spring Boot tree.
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Package
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22.13+ rather than plain 22: some dev dependencies declare
          # ^22.13.0 and older 22.x releases trip EBADENGINE warnings.
          node-version: '22.13'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly what the lockfile
      # pins and fails if package.json and the lockfile have drifted apart,
      # which is the check that matters after a dependency bump.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The real gate. Vercel runs this same build on merge, so a failure here
      # is a failure that would otherwise have taken the site down.
      - name: Build
        run: npm run build

      # Fails the run if a dependency has a known high or critical advisory.
      # Moderate and below are left as Dependabot's job so that routine noise
      # cannot block a merge.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # The loader is the third deployable piece, and until this job existed it was
  # the one nothing checked. Dependabot raised numpy 2.5.2 for it and the PR
  # showed four green ticks, because every check on the board belonged to the
  # other two jobs -- nothing had installed the loader's dependencies, let
  # alone imported them. numpy 2 is incompatible with the pinned nba_api 1.6.1
  # (which caps numpy<2.0.0), so the resolution below would have failed and
  # said so.
  #
  # This deliberately stops at resolve-and-import. The loader cannot actually
  # run here: stats.nba.com blocks datacenter IP ranges, so any real request
  # from an Actions runner hangs and times out. Importing is still worth doing
  # -- it is what catches an incompatible pin or a broken native wheel.
  data-loader:
    name: Data loader (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-loader
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the version the loader is developed and scheduled against.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-loader/requirements.txt

      # The real check. requirements.txt is fully pinned, so a set of pins that
      # cannot co-exist fails right here rather than on someone's laptop.
      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # Importing the module exercises nba_api, pandas and numpy together,
      # which is where an ABI or API break shows up. Safe to import: the file
      # only reads os.getenv defaults at module level and guards all work
      # behind `if __name__ == "__main__"`, so nothing connects or fetches.
      - name: Import the loader
        run: python -c "import load_nba_players, verify_player_table"
