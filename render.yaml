# Render Blueprint for the Spring Boot API.
#
# rootDir scopes build triggers to the backend, so frontend-only commits in
# this monorepo do not rebuild the API.
#
# dockerfilePath and dockerContext are resolved relative to rootDir, despite
# Render's docs describing them as repo-root-relative. Using ./nbastats/... here
# builds a doubled path (/opt/render/project/src/nbastats/nbastats) and fails
# with "invalid local: resolve". Keep these relative to nbastats/.
services:
  - type: web
    name: nba-stats-api
    runtime: docker
    plan: free
    region: virginia # Same region as the Supabase database (us-east-1).
    rootDir: nbastats
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Writes are enabled but remain gated by admin HTTP Basic credentials.
      - key: APP_WRITE_ENABLED
        value: "true"
      - key: ADMIN_USERNAME
        value: admin

      # sync: false keeps these out of source control. Render prompts for them
      # when the Blueprint is first created.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Comma-separated frontend origins, set once Vercel is live. The prod
      # profile requires this: the app will not start without it.
      #
      # Entries are matched as patterns, so a second entry ending in -* admits
      # the per-commit preview subdomains alongside the production origin:
      #   https://<project>.vercel.app,https://<project>-*.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
